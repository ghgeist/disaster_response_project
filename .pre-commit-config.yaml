# Install:
#   pip install pre-commit
#   pre-commit install
#   pre-commit run --files <file>
repos:
  - repo: https://github.com/psf/black
    rev: 23.9.1
    hooks:
      - id: black
        files: ^(app|src|scripts|tests)/
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.14
    hooks:
      - id: ruff
        files: ^(app|src|scripts|tests)/
  - repo: https://github.com/pylint-dev/pylint
    rev: v4.0.4
    hooks:
      - id: pylint
        files: ^(app|src|scripts|tests)/
        args:
          - --rcfile=.pylintrc
