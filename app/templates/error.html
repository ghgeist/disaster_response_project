{% extends "base.html" %}

{% block title %}Error - Signal Storm{% endblock %}

{% block content %}
    <!-- Hero Section -->
    <div class="text-center mb-12">
        <h1 class="text-4xl md:text-5xl font-extrabold text-white mb-3">
            Oops! Something Went Wrong
        </h1>
        <p class="text-lg text-gray-400 max-w-3xl mx-auto">
            We encountered an issue while processing your request.
        </p>
    </div>
    
    <div class="max-w-2xl mx-auto my-12 bg-brand-slate p-8 rounded-lg shadow-2xl text-center">
        <div class="border-2 border-red-500 rounded-lg p-6">
            <h2 class="text-3xl font-bold text-red-400 mb-4">An Error Occurred</h2>
            <p class="text-lg text-gray-300 mb-6">{{ message }}</p>
            <a href="/" class="bg-brand-accent-blue hover:bg-blue-600 text-white font-bold py-3 px-6 rounded-md transition duration-300 ease-in-out focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-offset-brand-slate focus:ring-brand-accent-blue">
                Return to Home
            </a>
        </div>
    </div>
{% endblock %}
